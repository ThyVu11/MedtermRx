# Run only on the approved isolated QA device with a matching APK.
# Defaults snapshot the public Anuria record read on 2026-11-08.
# The definition's existing "unrine" typo requires separate content review.
# Matching this snapshot verifies rendering, NOT medical accuracy.
# Override EXPECTED_DEFINITION_REGEX / EXPECTED_PART_TEXT_REGEX with Maestro -e
# only after reviewing any dataset change; do not weaken assertions to pass.
# This flow does not clear app data, save notes, rate cards, or upload images.
appId: com.teacy.medtermstudy
name: Android launch, search, and full term details
env:
  EXPECTED_DEFINITION_REGEX: ${EXPECTED_DEFINITION_REGEX || "^condition of without unrine$"}
  EXPECTED_PART_TEXT_REGEX: ${EXPECTED_PART_TEXT_REGEX || "^uria$"}
---
# Reject empty expectations before launching.
- assertTrue: ${EXPECTED_DEFINITION_REGEX.length > 0}
- assertTrue: ${EXPECTED_PART_TEXT_REGEX.length > 0}
- launchApp:
    clearState: false
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      text: "GET START"
      enabled: true
    timeout: 90000
- tapOn:
    text: "GET START"
    enabled: true
- extendedWaitUntil:
    visible: "Dissector"
    timeout: 15000
- tapOn: "Dissector"
- extendedWaitUntil:
    visible: 'Try "cholecystitis" or inflammation of the gallbladder'
    timeout: 15000
- tapOn: 'Try "cholecystitis" or inflammation of the gallbladder'
- inputText: "anuria"
- hideKeyboard
- extendedWaitUntil:
    visible: "^Anuria$"
    timeout: 30000
- tapOn: "^Anuria$"
# Specimen is rendered only by the full-detail WordDissector component.
- extendedWaitUntil:
    visible: "(?i)^specimen$"
    timeout: 30000
- assertVisible: "^Anuria$"
- assertVisible: "(?i)^definition$"
- assertVisible: "${EXPECTED_DEFINITION_REGEX}"
- assertVisible: "${EXPECTED_PART_TEXT_REGEX}"
