pluginManagement {
  try {
    def getenv = System.getenv()
    def field = getenv.getClass().getDeclaredField("m")
    field.setAccessible(true)
    def map = (Map) field.get(getenv)
    def path = map.get("PATH") ?: ""
    if (!path.contains("/opt/homebrew/bin")) {
      map.put("PATH", "/opt/homebrew/bin:/usr/local/bin:" + path)
    }
    if (!map.containsKey("NODE_BINARY")) {
      map.put("NODE_BINARY", "/opt/homebrew/bin/node")
    }
  } catch (Exception ignored) {}

  def findNodeCmd = { ->
    def nodeBinary = System.getenv("NODE_BINARY")
    if (nodeBinary && new File(nodeBinary).exists()) {
      return nodeBinary
    }

    if (new File("/opt/homebrew/bin/node").exists()) {
      return "/opt/homebrew/bin/node"
    }

    if (new File("/usr/local/bin/node").exists()) {
      return "/usr/local/bin/node"
    }
    
    def userHome = System.getProperty("user.home")
    def searchPaths = [
      "${userHome}/.nvm/versions/node",
      "${userHome}/.fnm/current/bin/node",
      "${userHome}/.volta/bin/node",
      "${userHome}/.asdf/shims/node",
      "${userHome}/.n/bin/node",
      "C:\\Program Files\\nodejs\\node.exe"
    ]

    for (path in searchPaths) {
      if (path.contains(".nvm")) {
        def nvmDir = new File(path)
        if (nvmDir.exists() && nvmDir.isDirectory()) {
          def versions = nvmDir.listFiles()
          if (versions && versions.length > 0) {
            def latest = versions.max { it.name }
            def nodeBin = new File(latest, "bin/node")
            if (nodeBin.exists()) return nodeBin.absolutePath
          }
        }
      } else {
        def file = new File(path)
        if (file.exists()) {
          return file.absolutePath
        }
      }
    }

    return "/opt/homebrew/bin/node"
  }

  def nodeCmd = findNodeCmd()
  println "DEBUG nodeCmd value: ${nodeCmd}"
  def extraPath = "/opt/homebrew/bin:/usr/local/bin:" + (System.getenv("PATH") ?: "")

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      environment("PATH", extraPath)
      commandLine(nodeCmd, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      environment("PATH", extraPath)
      commandLine(nodeCmd, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'MedTerm Study'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
